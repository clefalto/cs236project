services:
  db:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: CS236Project
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: threeoneone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: